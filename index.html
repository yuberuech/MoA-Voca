<style>
:root{font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb;font-synthesis:none}*{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}body{margin:0;min-height:100vh}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a6b4fb;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}a{color:#465de5}.shell{display:flex;min-height:100vh}.sidebar{width:248px;background:#131b31;color:#fff;padding:30px 17px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:4px 12px 18px;font-size:22px;font-weight:850;letter-spacing:-.8px}.logo{height:38px;width:38px;border-radius:13px;background:linear-gradient(135deg,#8a96ff,#5c63dd);display:grid;place-items:center;font-size:22px}.side-label{font-size:11px;letter-spacing:2px;color:#909ab7;padding:0 14px}.nav{width:100%;text-align:left;border:0;background:transparent;color:#b6bed2;padding:13px 15px;border-radius:12px;display:flex;gap:12px;align-items:center;font-weight:650;margin:3px 0}.nav.active,.nav:hover{background:#293451;color:#fff}.nav-ico{font-size:19px}.side-bottom{margin-top:auto;padding:18px 13px;border-top:1px solid #35405c;color:#9ba6c1;font-size:12px;line-height:1.7}.workspace{flex:1;min-width:0;max-width:1280px;margin:0 auto;padding:43px 46px 90px}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:30px}.eyebrow{font-size:13px;color:#6170a1;font-weight:750;letter-spacing:.7px}.heading{font-size:30px;font-weight:850;letter-spacing:-1px;margin:5px 0 8px}.muted{color:#758197;font-size:14px;line-height:1.6}.pill{border:1px solid #e3e7f0;background:#fff;color:#657187;border-radius:22px;font-size:12px;padding:9px 13px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:23px}.stat{background:#fff;border:1px solid #ebedf5;border-radius:18px;padding:22px;box-shadow:0 3px 18px #26305106}.stat-label{color:#77829a;font-size:13px}.stat-value{font-size:31px;font-weight:850;margin-top:9px;letter-spacing:-1px}.stat-small{font-size:12px;color:#9aa4b7;margin-top:6px}.hero{border-radius:22px;background:#e9ebff;display:flex;gap:24px;padding:28px 32px;justify-content:space-between;align-items:center;margin-bottom:24px}.hero h2{font-size:22px;margin:0 0 8px;letter-spacing:-.6px}.hero p{margin:0;color:#657099;font-size:14px;line-height:1.7}.hero-art{font-size:65px;flex-shrink:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;background:#5c64db;color:#fff;border-radius:11px;padding:12px 17px;font-size:14px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,transform .15s}.btn:hover{background:#4752c9}.btn.secondary{background:#fff;color:#354365;border:1px solid #dfe3ee}.btn.secondary:hover{background:#f0f2ff}.btn.danger{background:#fff0f0;color:#b83f49}.btn.sm{font-size:12px;padding:8px 12px}.panel{background:#fff;border-radius:19px;border:1px solid #ebedf5;padding:23px;margin-bottom:19px}.panel h2{font-size:18px;letter-spacing:-.4px;margin:0 0 17px}.panel h3{font-size:16px;margin:0 0 12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.field{border:1px solid #dbe1ed;border-radius:10px;background:#fff;padding:11px 12px;min-height:43px;max-width:100%;color:#253047}.field:focus{border-color:#6874ed}select.field{min-width:130px}.wide{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formlabel{display:block;color:#48546c;font-size:13px;font-weight:750;margin:0 0 7px}.formgroup{margin-bottom:15px}textarea.field{resize:vertical;min-height:90px}.wordtable{width:100%;border-collapse:collapse;text-align:left}.wordtable th{font-size:12px;color:#9aa4b8;font-weight:700;border-bottom:1px solid #ebedf5;padding:11px 10px}.wordtable td{padding:15px 10px;border-bottom:1px solid #f0f1f5;font-size:14px}.wordtable tr:last-child td{border-bottom:0}.wordtable .english{font-size:16px;font-weight:800}.tag{display:inline-block;background:#edf1ff;color:#5864bd;padding:5px 9px;border-radius:7px;font-size:12px;font-weight:650}.tag.bad{background:#fff0ed;color:#be6b45}.empty{text-align:center;padding:47px 16px;color:#8893a8;line-height:1.8}.empty .big{font-size:48px;display:block;margin-bottom:8px}.progress-line{height:9px;border-radius:6px;background:#e8eaf4;overflow:hidden}.progress-line>div{height:100%;background:#6873eb;border-radius:6px;transition:width .25s}.study-card{width:100%;border:1px solid #dce1f5;border-radius:23px;background:linear-gradient(150deg,#fff,#f5f6ff);padding:48px 20px;min-height:280px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;box-shadow:0 12px 29px #3d4c9b0e}.study-card:focus-visible{outline:3px solid #9fa9ff}.study-label{color:#8b96b3;font-size:13px;font-weight:750}.study-word{font-size:clamp(26px,4vw,42px);font-weight:850;overflow-wrap:anywhere;letter-spacing:-1px}.study-hint{color:#949db1;font-size:13px}.study-example{color:#697592;font-size:14px;margin-top:5px;white-space:pre-wrap}.study-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.setup{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.question-count{font-size:13px;color:#758197}.feedback{border:1px solid #e1e6f3;background:#f6f8fe;border-radius:14px;padding:15px;margin-top:16px;line-height:1.7}.feedback.good{border-color:#b8e9d3;background:#f1fcf6;color:#277653}.feedback.bad{border-color:#f4cbc6;background:#fff7f5;color:#a44840}.answerbox{font-size:17px;padding:15px;min-height:53px}.small-note{font-size:12px;color:#8a95aa;line-height:1.7}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#252e45;color:white;padding:12px 22px;border-radius:12px;box-shadow:0 8px 20px #2224;z-index:50;max-width:90vw;text-align:center;font-size:13px}.modal-bg{position:fixed;inset:0;background:#0c163a91;display:grid;place-items:center;padding:20px;z-index:40}.modal{background:#fff;width:min(530px,100%);max-height:95vh;overflow:auto;border-radius:20px;padding:25px;box-shadow:0 20px 60px #0b173455}.modal h2{margin:0 0 20px}.mobilehead{display:none}.help{background:#f7f8fd;border-radius:12px;padding:14px;font-size:13px;color:#65718a;line-height:1.9}.seg{display:flex;flex-wrap:wrap;gap:7px}.seg button{border:1px solid #dfe4f2;background:#fff;border-radius:9px;padding:9px 13px;color:#6f7b93;font-weight:700}.seg button.sel{background:#e9ecff;color:#4d5fc2;border-color:#bfc8ff}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:19px 0}.result{background:#f7f8ff;border-radius:13px;padding:18px;text-align:center}.result strong{display:block;font-size:26px}.result span{font-size:12px;color:#8b95ac}.hidden{display:none!important}@media(max-width:900px){.sidebar{width:83px;padding:24px 10px}.brand{padding:0 0 22px;justify-content:center}.brand .brandname,.nav span:not(.nav-ico),.side-label,.side-bottom{display:none}.nav{justify-content:center;padding:13px}.workspace{padding:32px 25px 85px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.shell{display:block}.sidebar{position:fixed;bottom:0;top:auto;width:100%;height:68px;padding:6px 8px;z-index:20;flex-direction:row;justify-content:space-around;gap:2px;box-shadow:0 -4px 18px #17233a13}.brand,.side-label,.side-bottom{display:none}.nav{width:auto;flex:1;flex-direction:column;gap:2px;padding:6px 2px;margin:0;font-size:9px;border-radius:8px}.nav span:not(.nav-ico){display:block;font-size:10px}.nav-ico{font-size:20px}.workspace{padding:25px 16px 104px}.heading{font-size:25px}.topline{margin-bottom:24px}.stats{gap:9px}.stat{padding:16px}.stat-value{font-size:25px}.hero{padding:23px 19px}.hero-art{font-size:41px}.hero h2{font-size:19px}.panel{padding:18px}.grid2,.setup{grid-template-columns:1fr}.wordtable th:nth-child(3),.wordtable td:nth-child(3){display:none}.wordtable th,.wordtable td{padding:12px 5px}.study-card{min-height:240px;padding:28px 12px}.topline .pill{display:none}}

<body>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">✦</span><span class="brandname">모아보카</span></div><div class="side-label">MY LEARNING</div><nav aria-label="메뉴"><button class="nav active" data-page="home"><span class="nav-ico">⌂</span><span>홈</span></button><button class="nav" data-page="words"><span class="nav-ico">▤</span><span>단어장</span></button><button class="nav" data-page="learn"><span class="nav-ico">▣</span><span>암기</span></button><button class="nav" data-page="quiz"><span class="nav-ico">✎</span><span>시험</span></button><button class="nav" data-page="wrong"><span class="nav-ico">↺</span><span>오답</span></button><button class="nav" data-page="settings"><span class="nav-ico">⚙</span><span>설정</span></button></nav><div class="side-bottom">매일 조금씩, 확실하게.<br>나만의 영어 학습 공간</div></aside><main id="app" class="workspace"></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';
const KEY='moavoca:v1', app=document.getElementById('app');
let state=load(),page='home',filter='',selectedDeck='all',learn=null,quiz=null,quizSettings={deck:'all',mode:'ko-en',count:'20',wrong:false};
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
function empty(){return {words:[],decks:['기본 단어장'],sessions:[]}}
function normalize(raw){if(!raw||!Array.isArray(raw.words))throw Error('올바른 단어장 백업 파일이 아닙니다.');let words=raw.words.slice(0,20000).filter(x=>x&&typeof x.word==='string'&&typeof x.meaning==='string').map(x=>({id:String(x.id||uid()),word:x.word.slice(0,200).trim(),meaning:x.meaning.slice(0,500).trim(),deck:String(x.deck||'기본 단어장').slice(0,80),example:String(x.example||'').slice(0,1000),known:Math.max(0,Number(x.known)||0),missed:Math.max(0,Number(x.missed)||0),correct:Math.max(0,Number(x.correct)||0),createdAt:Number(x.createdAt)||Date.now()})).filter(x=>x.word&&x.meaning);let decks=Array.isArray(raw.decks)?raw.decks.filter(x=>typeof x==='string'&&x.trim()).slice(0,100):[];decks=[...new Set(['기본 단어장',...decks,...words.map(w=>w.deck)])];return {words,decks,sessions:Array.isArray(raw.sessions)?raw.sessions.slice(-100).filter(x=>typeof x.correct==='number'&&typeof x.total==='number'):[]}}
function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY))||empty())}catch(e){return empty()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.')}}
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">'+h(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2800)}
function allWrong(){return state.words.filter(w=>w.missed>0)}
function title(t,sub){return `<div class="topline"><div><div class="eyebrow">YOUR PERSONAL VOCABULARY</div><h1 class="heading">${h(t)}</h1><div class="muted">${h(sub)}</div></div><span class="pill">✦ 나만의 단어장</span></div>`}
const btn=(name,action,other='')=>`<button class="btn ${other}" data-action="${action}">${h(name)}</button>`;
function deckOptions(current='all',all=true){return `${all?'<option value="all">전체 단어장</option>':''}`+state.decks.map(d=>`<option value="${h(d)}" ${current===d?'selected':''}>${h(d)}</option>`).join('')}
function setPage(p){page=p;learn=null;quiz=null;filter='';document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'instant'})}
function render(){if(page==='home')home();else if(page==='words')words();else if(page==='learn')learnView();else if(page==='quiz')quizView();else if(page==='wrong')wrongView();else settings();}
function home(){let total=state.words.length,master=state.words.filter(w=>w.known>0).length,wrong=allWrong().length,last=state.sessions.at(-1),accuracy=last?Math.round(last.correct/Math.max(1,last.total)*100):0;
app.innerHTML=title('오늘도 한 단어씩','직접 만든 단어장으로 외우고, 시험 보고, 오답까지 복습하세요.')+`<div class="stats"><div class="stat"><div class="stat-label">전체 단어</div><div class="stat-value">${total}</div><div class="stat-small">등록된 단어</div></div><div class="stat"><div class="stat-label">암기 체크</div><div class="stat-value">${master}</div><div class="stat-small">한 번 이상 기억한 단어</div></div><div class="stat"><div class="stat-label">오답 단어</div><div class="stat-value">${wrong}</div><div class="stat-small">다시 공부할 단어</div></div><div class="stat"><div class="stat-label">최근 시험</div><div class="stat-value">${last?accuracy+'%':'—'}</div><div class="stat-small">${last?last.correct+'/'+last.total+'문제 정답':'시험 기록 없음'}</div></div></div><section class="hero"><div><h2>${total?'준비되셨나요? 오늘도 복습해요.':'첫 단어부터 시작해 볼까요?'}</h2><p>영어 단어, 한국어 뜻, 예문을 직접 등록하고<br>카드 암기와 철자 시험으로 실력을 확인하세요.</p><div class="actions">${btn('+ 단어 추가','add')}${btn('플래시카드 시작','go-learn','secondary')}</div></div><div class="hero-art" aria-hidden="true">📚</div></section><div class="panel"><div class="toolbar"><h2 style="margin:0">학습 현황</h2><span class="small-note">암기 체크 ${total?Math.round(master/total*100):0}%</span></div><div class="progress-line"><div style="width:${total?master/total*100:0}%"></div></div><div class="actions">${btn('단어 관리','go-words','secondary')}${btn('시험 보기','go-quiz','secondary')}${btn('오답 복습','go-wrong','secondary')}</div></div>${!total?`<div class="panel"><h2>빠르게 시작하기</h2><p class="muted">단어를 하나씩 등록하거나, 여러 줄을 한 번에 추가할 수 있습니다. 체험하고 싶다면 샘플 단어 8개를 불러오세요.</p><div class="actions">${btn('여러 단어 한 번에 추가','bulk','secondary')}${btn('샘플 단어 8개 추가','samples','secondary')}</div></div>`:''}`}
function wordRows(data){return data.length?`<div style="overflow-x:auto"><table class="wordtable"><thead><tr><th>영어 단어</th><th>한국어 뜻</th><th>단어장</th><th>관리</th></tr></thead><tbody>${data.map(w=>`<tr><td><div class="english">${h(w.word)}</div>${w.missed?'<span class="tag bad">오답 '+w.missed+'</span>':''}</td><td>${h(w.meaning)}</td><td><span class="tag">${h(w.deck)}</span></td><td><div class="flex"><button class="btn secondary sm" data-action="edit" data-id="${h(w.id)}">수정</button><button class="btn danger sm" data-action="delete" data-id="${h(w.id)}">삭제</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><span class="big">🗂️</span>일치하는 단어가 없습니다.<br>단어를 등록하거나 검색 조건을 바꿔 주세요.</div>`}
function words(){let list=state.words.filter(w=>(selectedDeck==='all'||w.deck===selectedDeck)&&[w.word,w.meaning,w.example].some(x=>x.toLocaleLowerCase().includes(filter.toLocaleLowerCase())));app.innerHTML=title('나의 단어장','단어 추가, 검색, 수정, 삭제와 DAY별 분류를 관리하세요.')+`<div class="panel"><div class="toolbar"><div class="flex"><input class="field" id="searchWord" placeholder="단어 또는 뜻 검색" value="${h(filter)}" aria-label="단어 검색"><select class="field" id="wordDeck">${deckOptions(selectedDeck)}</select></div><div class="flex">${btn('+ 단어 추가','add')}${btn('일괄 추가','bulk','secondary')}</div></div><div class="small-note" style="margin-bottom:8px">${list.length}개 표시 · 총 ${state.words.length}개</div><div id="wordRows">${wordRows(list)}</div></div><div class="panel"><h2>단어장 분류</h2><div class="flex">${state.decks.map(d=>`<span class="tag">${h(d)} (${state.words.filter(w=>w.deck===d).length})</span>`).join('')}</div><div class="actions">${btn('+ 새 분류 만들기','deck','secondary')}</div></div>`}
function updateRows(){let list=state.words.filter(w=>(selectedDeck==='all'||w.deck===selectedDeck)&&[w.word,w.meaning,w.example].some(x=>x.toLocaleLowerCase().includes(filter.toLocaleLowerCase())));let target=document.getElementById('wordRows');if(target)target.innerHTML=wordRows(list)}
function modal(content){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${content}</div></div>`;document.querySelector('.modal input,.modal textarea,.modal select')?.focus()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function editModal(id){let w=state.words.find(w=>w.id===id),chosen=w?.deck||state.decks[0];modal(`<h2>${w?'단어 수정':'새 단어 추가'}</h2><form id="wordForm" data-id="${h(id||'')}"><div class="formgroup"><label class="formlabel" for="eng">영어 단어 / 표현 *</label><input id="eng" class="field wide" required maxlength="200" value="${h(w?.word||'')}" placeholder="예: apprehensive" autocomplete="off"></div><div class="formgroup"><label class="formlabel" for="kor">한국어 뜻 * <span class="small-note">여러 뜻은 쉼표로 구분</span></label><input id="kor" class="field wide" required maxlength="500" value="${h(w?.meaning||'')}" placeholder="예: 걱정하는, 불안해하는"></div><div class="formgroup"><label class="formlabel" for="example">예문 (선택)</label><textarea id="example" class="field wide" placeholder="예: She felt apprehensive about the test.">${h(w?.example||'')}</textarea></div><div class="formgroup"><label class="formlabel" for="deck">단어장 분류</label><select id="deck" class="field wide">${deckOptions(chosen,false)}</select></div><div class="actions"> <button class="btn" type="submit">저장하기</button>${btn('취소','close','secondary')}</div></form>`)}
function bulkModal(){modal(`<h2>여러 단어 한 번에 추가</h2><p class="small-note">한 줄에 한 단어씩 입력하세요. 구분 기호는 | 또는 탭(Tab)이며, 예문은 생략할 수 있습니다.</p><div class="help">apprehensive | 걱정하는, 불안해하는<br>arrangement | 준비, 마련<br>reluctantly | 마지못해 | He reluctantly agreed.</div><form id="bulkForm"><div class="formgroup" style="margin-top:15px"><label class="formlabel" for="bulkText">단어 목록</label><textarea id="bulkText" class="field wide" style="height:190px" required placeholder="영어 단어 | 한국어 뜻 | 예문(선택)"></textarea></div><div class="formgroup"><label class="formlabel" for="bulkDeck">저장할 분류</label><select id="bulkDeck" class="field wide">${deckOptions(state.decks[0],false)}</select></div><div class="actions"><button class="btn" type="submit">모두 추가</button>${btn('취소','close','secondary')}</div></form>`)}
function deckModal(){modal(`<h2>새 단어장 분류</h2><form id="deckForm"><div class="formgroup"><label class="formlabel" for="deckName">분류 이름</label><input class="field wide" id="deckName" required maxlength="80" placeholder="예: DAY 1 / 비즈니스"></div><div class="actions"><button type="submit" class="btn">만들기</button>${btn('취소','close','secondary')}</div></form>`)}
function pool(deck='all',wrong=false){return state.words.filter(w=>(deck==='all'||w.deck===deck)&&(!wrong||w.missed>0))}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function startLearn(wrong=false){let arr=shuffle(pool('all',wrong));if(!arr.length){toast(wrong?'복습할 오답이 없습니다.':'단어를 먼저 등록해 주세요.');return}learn={ids:arr.map(w=>w.id),i:0,flipped:false,wrongOnly:wrong};page='learn';syncNav();render()}
function syncNav(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function learnView(){if(!learn){app.innerHTML=title('플래시카드 암기','카드를 눌러 뜻을 확인하고 아는 단어를 체크하세요.')+`<div class="panel"><div class="setup"><div><label class="formlabel">학습할 단어장</label><select class="field wide" id="learnDeck">${deckOptions()}</select></div><div><label class="formlabel">학습 범위</label><select class="field wide" id="learnScope"><option value="all">전체</option><option value="wrong">오답만</option></select></div></div><div class="actions">${btn('암기 시작','start-learn')}</div></div>`;return}let w=state.words.find(x=>x.id===learn.ids[learn.i]);if(!w){learn=null;render();return}app.innerHTML=title('플래시카드 암기','카드를 클릭하거나 스페이스 키를 눌러 정답을 확인하세요.')+`<div class="panel"><div class="toolbar"><strong>${learn.i+1} / ${learn.ids.length}</strong><span class="question-count">${learn.wrongOnly?'오답 복습':'전체 암기'}</span></div><div class="progress-line" style="margin-bottom:23px"><div style="width:${(learn.i+1)/learn.ids.length*100}%"></div></div><button type="button" class="study-card" data-action="flip" aria-label="카드 뒤집기"><span class="study-label">${learn.flipped?'뜻 / MEANING':'영어 / ENGLISH'}</span><span class="study-word">${h(learn.flipped?w.meaning:w.word)}</span>${learn.flipped&&w.example?`<span class="study-example">${h(w.example)}</span>`:''}<span class="study-hint">${learn.flipped?'다시 누르면 영어 표시':'눌러서 뜻 확인 ↻'}</span></button><div class="study-actions">${learn.flipped?`${btn('✕ 아직 몰라요','learn-miss','secondary')}${btn('✓ 외웠어요','learn-know')}`:btn('정답 보기','flip','secondary')} ${btn('그만하기','learn-stop','secondary')}</div></div>`}
function nextLearn(known){let w=state.words.find(x=>x.id===learn.ids[learn.i]);if(w){if(known)w.known++;else w.missed++;save()}learn.i++;learn.flipped=false;if(learn.i>=learn.ids.length){let n=learn.ids.length;learn=null;app.innerHTML=title('암기 완료!','오늘의 복습을 마쳤습니다.')+`<div class="panel"><div class="empty"><span class="big">🎉</span>${n}개 단어 학습 완료</div><div class="actions">${btn('다시 학습','go-learn')}${btn('시험 보기','go-quiz','secondary')}</div></div>`}else render()}
function quizView(){if(!quiz){let count=pool(quizSettings.deck,quizSettings.wrong).length;app.innerHTML=title('단어 시험','한→영 철자 입력, 영→한 뜻 입력 또는 혼합 시험을 볼 수 있습니다.')+`<div class="panel"><h2>시험 설정</h2><div class="setup"><div><label class="formlabel" for="quizDeck">단어장</label><select class="field wide" id="quizDeck">${deckOptions(quizSettings.deck)}</select></div><div><label class="formlabel" for="quizMode">출제 방식</label><select class="field wide" id="quizMode"><option value="ko-en" ${quizSettings.mode==='ko-en'?'selected':''}>한 → 영 (철자 검사)</option><option value="en-ko" ${quizSettings.mode==='en-ko'?'selected':''}>영 → 한 (뜻 맞히기)</option><option value="mixed" ${quizSettings.mode==='mixed'?'selected':''}>혼합 시험</option></select></div><div><label class="formlabel" for="quizCount">문제 수</label><select class="field wide" id="quizCount"><option value="10">10문제</option><option value="20" ${quizSettings.count==='20'?'selected':''}>20문제</option><option value="40" ${quizSettings.count==='40'?'selected':''}>40문제</option><option value="all" ${quizSettings.count==='all'?'selected':''}>전체</option></select></div></div><div style="margin-top:18px"><label><input id="quizWrong" type="checkbox" ${quizSettings.wrong?'checked':''}> 오답 단어만 출제</label></div><div class="actions">${btn('시험 시작','start-quiz')}</div><p class="small-note">현재 출제 가능: ${count}개 · 영어 철자는 대소문자를 구분하지 않지만, 글자 누락·순서·추가는 오답입니다. 뜻 시험은 등록된 뜻 중 하나를 입력하면 정답입니다.</p></div>`;return}if(quiz.done){quizResults();return}let item=quiz.items[quiz.i],w=state.words.find(x=>x.id===item.id);if(!w){quiz.i++;if(quiz.i>=quiz.items.length)quiz.done=true;render();return}let isSpelling=item.mode==='ko-en';app.innerHTML=title('시험 진행 중',`${quiz.i+1}번 문제 · ${isSpelling?'한국어 뜻을 보고 영어 철자를 입력하세요.':'영어를 보고 한국어 뜻을 입력하세요.'}`)+`<div class="panel"><div class="toolbar"><strong>문제 ${quiz.i+1} / ${quiz.items.length}</strong><span class="question-count">정답 ${quiz.correct}개</span></div><div class="progress-line" style="margin-bottom:20px"><div style="width:${quiz.i/quiz.items.length*100}%"></div></div><div class="study-card" style="min-height:185px"><span class="study-label">${isSpelling?'뜻을 보고 영어로 쓰세요':'영어를 보고 뜻을 쓰세요'}</span><span class="study-word">${h(isSpelling?w.meaning:w.word)}</span></div><form id="answerForm" style="margin-top:22px"><label class="formlabel" for="answer">나의 답안</label><input class="field wide answerbox" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="정답 입력" ${quiz.feedback?'disabled':''} required>${quiz.feedback?`<div class="feedback ${quiz.feedback.good?'good':'bad'}"><strong>${quiz.feedback.good?'✓ 정답입니다!':'✕ 오답입니다.'}</strong><div>내 답: ${h(quiz.feedback.answer||'(미응답)')}</div><div>정답: <strong>${h(quiz.feedback.correctAnswer)}</strong></div></div>`:''}<div class="actions">${quiz.feedback?btn('다음 문제 →','quiz-next'): '<button class="btn" type="submit">채점하기</button>'}${btn('시험 종료','quiz-stop','secondary')}</div></form></div>`;let answer=document.getElementById('answer');if(quiz.feedback)answer.value=quiz.feedback.answer;else answer.focus()}
function normEn(s){return s.trim().normalize('NFKC').toLocaleLowerCase('en-US').replace(/\s+/g,' ')}
function normKo(s){return s.trim().normalize('NFKC').replace(/[.!?。！？]/g,'').replace(/\s+/g,' ').toLocaleLowerCase()}
function checkAnswer(answer,w,mode){if(mode==='ko-en'){return normEn(answer)===normEn(w.word)}let list=w.meaning.split(/[,;/、，]|\n| 또는 /g).map(normKo).filter(Boolean);return list.includes(normKo(answer))}
function startQuiz(){quizSettings={deck:document.getElementById('quizDeck').value,mode:document.getElementById('quizMode').value,count:document.getElementById('quizCount').value,wrong:document.getElementById('quizWrong').checked};let arr=shuffle(pool(quizSettings.deck,quizSettings.wrong));let n=quizSettings.count==='all'?arr.length:Math.min(arr.length,Number(quizSettings.count));if(!n){toast('출제할 단어가 없습니다.');return}quiz={items:arr.slice(0,n).map((w,i)=>({id:w.id,mode:quizSettings.mode==='mixed'?(i%2?'en-ko':'ko-en'):quizSettings.mode})),i:0,correct:0,feedback:null,results:[],done:false};render()}
function grade(answer){if(!quiz||quiz.feedback)return;let item=quiz.items[quiz.i],w=state.words.find(x=>x.id===item.id);if(!w)return;let good=checkAnswer(answer,w,item.mode);if(good){w.correct++;quiz.correct++}else w.missed++;quiz.results.push({word:w.word,meaning:w.meaning,answer,good,mode:item.mode});quiz.feedback={good,answer,correctAnswer:item.mode==='ko-en'?w.word:w.meaning};save();render()}
function nextQuestion(){quiz.i++;quiz.feedback=null;if(quiz.i>=quiz.items.length){quiz.done=true;state.sessions.push({date:Date.now(),correct:quiz.correct,total:quiz.items.length});state.sessions=state.sessions.slice(-100);save()}render()}
function quizResults(){let total=quiz.items.length,good=quiz.correct,bad=total-good;app.innerHTML=title('시험 결과',`${total}문제 중 ${good}문제 정답 · ${Math.round(good/total*100)}점`)+`<div class="panel"><div class="results"><div class="result"><strong>${Math.round(good/total*100)}점</strong><span>정답률</span></div><div class="result"><strong>${good}</strong><span>정답</span></div><div class="result"><strong>${bad}</strong><span>오답</span></div></div><h2>채점 기록</h2><div style="overflow-x:auto"><table class="wordtable"><thead><tr><th>문제</th><th>내 답</th><th>결과</th></tr></thead><tbody>${quiz.results.map(x=>`<tr><td><strong>${h(x.mode==='ko-en'?x.meaning:x.word)}</strong><div class="small-note">정답: ${h(x.mode==='ko-en'?x.word:x.meaning)}</div></td><td>${h(x.answer)}</td><td>${x.good?'<span class="tag">정답</span>':'<span class="tag bad">오답</span>'}</td></tr>`).join('')}</tbody></table></div><div class="actions">${btn('새 시험','quiz-again')}${btn('오답 복습','go-wrong','secondary')}</div></div>`}
function wrongView(){let list=allWrong().sort((a,b)=>b.missed-a.missed);app.innerHTML=title('오답 복습',`지금까지 틀렸거나 암기 중 '아직 몰라요'를 선택한 단어 ${list.length}개를 모았습니다.`)+`<div class="panel"><div class="toolbar"><h2 style="margin:0">복습 목록</h2><div class="flex">${btn('오답 카드 암기','wrong-learn')}${btn('오답만 시험','wrong-quiz','secondary')}</div></div>${wordRows(list)}${list.length?`<p class="small-note">오답 목록에서 제외하려면 '오답 기록 초기화'를 누르세요. 기록만 지우며 단어는 삭제되지 않습니다.</p><div class="actions">${btn('오답 기록 초기화','clear-wrong','danger')}</div>`:''}</div>`}
function settings(){app.innerHTML=title('설정 및 데이터 관리','기기 이동을 위해 백업 파일을 저장하고 복원하세요.')+`<div class="panel"><h2>데이터 백업 · 복원</h2><p class="muted">단어와 암기·오답·시험 기록을 JSON 파일로 저장합니다. 이 파일을 다른 기기로 옮겨 복원할 수 있습니다.</p><div class="actions">${btn('↓ 백업 파일 다운로드','export')}${btn('↑ 백업 파일 불러오기','import','secondary')}</div><input type="file" id="importFile" accept=".json,application/json" class="hidden"><p class="small-note">백업을 불러오면 현재 브라우저의 단어장이 교체됩니다. 먼저 기존 데이터를 백업해 두세요.</p></div><div class="panel"><h2>저장 방식 안내</h2><div class="help">✔ 이 앱은 인터넷 연결 없이도 기본 기능을 사용할 수 있습니다.<br>✔ 단어와 학습 기록은 현재 브라우저의 로컬 저장소에 보관됩니다.<br>✔ 같은 웹주소로 접속하더라도 PC와 스마트폰 데이터는 자동 동기화되지 않습니다.<br>✔ 시크릿 모드 사용, 브라우저 데이터 삭제, 다른 주소 접속 시 기록이 유지되지 않을 수 있습니다.<br>✔ 다른 기기에서는 백업 파일을 내보내고 가져와서 옮기세요.</div></div><div class="panel"><h2>전체 데이터 초기화</h2><p class="muted">모든 단어와 학습 기록을 삭제합니다. 복원하려면 이전 백업 파일이 필요합니다.</p>${btn('모든 데이터 삭제','clear-all','danger')}</div>`}
function download(data,name,mime){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:mime}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const sample=[['apprehensive','걱정하는, 불안해하는'],['arrangement','준비, 마련, 주선'],['reluctantly','마지못해, 꺼려하며'],['refrain','삼가다, 자제하다'],['acquaint','익숙하게 하다, 알게 하다'],['thoroughly','철저하게, 완전히'],['accustomed','익숙한'],['achieve','달성하다']];
app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let action=b.dataset.action,id=b.dataset.id;
if(action.startsWith('go-')){setPage(action.slice(3));return}
switch(action){case 'add':editModal();break;case 'bulk':bulkModal();break;case 'deck':deckModal();break;case 'edit':editModal(id);break;case 'delete':{let w=state.words.find(x=>x.id===id);if(w&&confirm(`'${w.word}' 단어를 삭제하시겠습니까?`)){state.words=state.words.filter(x=>x.id!==id);save();render();toast('단어를 삭제했습니다.')}break}case 'samples':{let added=0;for(let [word,meaning] of sample){if(!state.words.some(w=>normEn(w.word)===normEn(word)&&w.deck==='기본 단어장')){state.words.push({id:uid(),word,meaning,deck:'기본 단어장',example:'',known:0,missed:0,correct:0,createdAt:Date.now()});added++}}save();render();toast(`샘플 단어 ${added}개를 추가했습니다.`);break}case 'start-learn':{let arr=shuffle(pool(document.getElementById('learnDeck').value,document.getElementById('learnScope').value==='wrong'));if(!arr.length){toast('학습할 단어가 없습니다.');return}learn={ids:arr.map(w=>w.id),i:0,flipped:false,wrongOnly:document.getElementById('learnScope').value==='wrong'};render();break}case 'flip':if(learn){learn.flipped=!learn.flipped;render()}break;case 'learn-know':nextLearn(true);break;case 'learn-miss':nextLearn(false);break;case 'learn-stop':learn=null;render();break;case 'start-quiz':startQuiz();break;case 'quiz-next':nextQuestion();break;case 'quiz-stop':if(confirm('진행 중인 시험을 종료하시겠습니까? 미완료 문제는 채점하지 않습니다.')){quiz=null;render()}break;case 'quiz-again':quiz=null;render();break;case 'wrong-learn':startLearn(true);break;case 'wrong-quiz':quizSettings.wrong=true;setPage('quiz');break;case 'clear-wrong':if(confirm('모든 오답 기록을 초기화하시겠습니까?')){state.words.forEach(w=>w.missed=0);save();render()}break;case 'export':download(JSON.stringify({format:'moavoca',version:1,exportedAt:new Date().toISOString(),...state},null,2),'moavoca-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('백업 파일을 다운로드했습니다.');break;case 'import':document.getElementById('importFile').click();break;case 'clear-all':if(confirm('모든 단어와 학습 기록을 삭제하시겠습니까?')&&confirm('정말 삭제하시겠습니까? 복구하려면 백업 파일이 필요합니다.')){state=empty();save();render();toast('초기화했습니다.')}break}
});
app.addEventListener('input',e=>{if(e.target.id==='searchWord'){filter=e.target.value;updateRows()}});
app.addEventListener('change',e=>{if(e.target.id==='wordDeck'){selectedDeck=e.target.value;updateRows()}if(e.target.id==='importFile'&&e.target.files?.[0]){const file=e.target.files[0];if(file.size>8*1024*1024){toast('백업 파일이 너무 큽니다 (최대 8MB).');return}file.text().then(t=>{let next=normalize(JSON.parse(t));if(confirm(`단어 ${next.words.length}개가 들어 있는 백업으로 기존 데이터를 교체하시겠습니까?`)){state=next;save();setPage('home');toast('백업을 복원했습니다.')}}).catch(err=>{alert('백업을 불러오지 못했습니다: '+err.message)})}});
app.addEventListener('submit',e=>{if(e.target.id==='answerForm'){e.preventDefault();let text=document.getElementById('answer').value;grade(text)}});
document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.classList.contains('modal-bg')||e.target.closest('[data-action="close"]')){closeModal()}});
document.getElementById('modalRoot').addEventListener('submit',e=>{e.preventDefault();let form=e.target;if(form.id==='wordForm'){let word=document.getElementById('eng').value.trim(),meaning=document.getElementById('kor').value.trim(),example=document.getElementById('example').value.trim(),deck=document.getElementById('deck').value,id=form.dataset.id;if(!word||!meaning)return;let existing=state.words.find(w=>w.id===id),duplicate=state.words.some(w=>w.id!==id&&normEn(w.word)===normEn(word)&&w.deck===deck);if(duplicate&&!confirm('이 분류에 같은 영어 단어가 있습니다. 그래도 저장할까요?'))return;if(existing)Object.assign(existing,{word,meaning,example,deck});else state.words.push({id:uid(),word,meaning,example,deck,known:0,missed:0,correct:0,createdAt:Date.now()});save();closeModal();render();toast('단어를 저장했습니다.')}else if(form.id==='bulkForm'){let deck=document.getElementById('bulkDeck').value,lines=document.getElementById('bulkText').value.split(/\r?\n/),added=0,skipped=0;for(let line of lines){if(!line.trim())continue;let p=line.includes('|')?line.split('|'):line.split('\t');let word=(p[0]||'').trim(),meaning=(p[1]||'').trim(),example=p.slice(2).join('|').trim();if(!word||!meaning||state.words.some(w=>normEn(w.word)===normEn(word)&&w.deck===deck)){skipped++;continue}state.words.push({id:uid(),word:word.slice(0,200),meaning:meaning.slice(0,500),example:example.slice(0,1000),deck,known:0,missed:0,correct:0,createdAt:Date.now()});added++}save();closeModal();render();toast(`${added}개 추가 · ${skipped}개 건너뜀`)}else if(form.id==='deckForm'){let name=document.getElementById('deckName').value.trim();if(!name)return;if(state.decks.includes(name)){toast('이미 있는 분류입니다.');return}state.decks.push(name);save();closeModal();render();toast('새 단어장을 만들었습니다.')}});
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();else if(e.code==='Space'&&page==='learn'&&learn&&!e.target.closest('input,textarea,select,button')){e.preventDefault();learn.flipped=!learn.flipped;render()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
</script>
